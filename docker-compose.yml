# ===========================================
# Uso: docker-compose up --build
# ===========================================

version: '3.8'

services:
  # Base de datos PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: calculator-db
    environment:
      POSTGRES_DB: calculator_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d calculator_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - calculator-network

  # API Calculadora (aplicacion principal)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: calculator-api
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: calculator_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SERVER_PORT: 8080
      EXTERNAL_SERVICE_URL: http://mock-service:8081
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - calculator-network

  # Servicio mock para simular el servicio externo de porcentaje
  mock-service:
    image: mockoon/cli:latest
    container_name: mock-percentage-service
    command: ["--data", "/data/mock.json", "--port", "8081"]
    volumes:
      - ./mock:/data
    ports:
      - "8081:8081"
    networks:
      - calculator-network

# Volumenes persistentes
volumes:
  postgres_data:

# Red interna para comunicacion entre servicios
networks:
  calculator-network:
    driver: bridge
